# Pine Hills Fantasy Football League — Zensical edition
# See skills/zensical-setup for the authoritative config reference.

[project]
site_name = "Pine Hills Fantasy Football League"
site_url = "https://narenp12.github.io/pine-hills-wiki"   # required for instant nav
site_description = "The collaborative history of the Pine Hills Fantasy Football League."
site_author = "Pine Hills League"
# Plain hyphen, per the project's no-en/em-dash rule (zensical/transform.py).
copyright = "&copy; 2018-2025 Pine Hills Fantasy Football League"
repo_url = "https://github.com/narenp12/pine-hills-wiki"
repo_name = "narenp12/pine-hills-wiki"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
dev_addr = "localhost:7860"
# Enables the pencil/eye actions below. Docs live under zensical/docs.
edit_uri = "edit/main/zensical/docs/"

# Explicit nav: without it the tabs are alphabetical, which buries Seasons and
# Teams behind the two thinnest pages, and labels the home tab with the whole
# site name.
nav = [
  { Home = "index.md" },
  { Seasons = "seasons/index.md" },
  { Teams = "teams/index.md" },
  { Records = "records/index.md" },
  { "Draft History" = "draft/index.md" },
  { Playoffs = "playoffs.md" },
  { Champions = "champions.md" },
]

# Custom CSS / JS are TOP-LEVEL [project] keys (not under [project.theme]).
extra_css = [
  "stylesheets/zensical.css",
]
# tablesort.js is self-contained; the unpkg tablesort bundle was loaded on every
# page and never called, so it is not listed here.
extra_javascript = [
  "javascripts/tablesort.js",
]

[project.theme]
variant = "modern"
# overrides/main.html adds the Open Graph / Twitter tags the base template omits.
custom_dir = "overrides"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "navigation.indexes",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.tooltips",
  "content.footnote.tooltips",
  "content.action.edit",
  "content.action.view",
  "navigation.path",
  "announce.dismiss",
  "header.autohide",
]
font.text = "Source Serif 4"
font.code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"
logo = "lucide/tree-pine"

# DO NOT add a [project.markdown_extensions.*] table here.
#
# Zensical falls back to DEFAULT_MARKDOWN_EXTENSIONS only when the key is
# ABSENT (zensical/config.py: `config.get("markdown_extensions",
# DEFAULT_MARKDOWN_EXTENSIONS)`). Declaring any single extension replaces the
# whole default set. This file used to declare a superfences custom_fence for
# mermaid, which silently reduced the site to ["pymdownx.superfences", "toc",
# "tables"] and disabled md_in_html, attr_list, admonition, def_list,
# footnotes, emoji, tasklist, tabbed, permalinks and the rest.
#
# The mermaid fence was never needed: Zensical registers it natively, and
# playoff brackets render without any extension config. If an extension really
# must be configured, re-declare the full default set alongside it.

[project.extra]
# Applied by scripts/generate.py: any page whose key facts are still `_TBD_`
# carries `status: incomplete` in its front matter, so readers can tell an
# unfinished page from a finished one at a glance in the nav.
status = { incomplete = "Awaiting league records" }
