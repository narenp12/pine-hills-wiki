# =============================================================================
# Pine Hills Fantasy League — "League Bible"
# -----------------------------------------------------------------------------
# The single source of truth for HUMAN-ONLY facts that cannot be derived from
# the captured Yahoo data.
#
# Facts that the machine CAN derive (W-L, points for/against, finish, playoff
# seed, draft board, all-time records, every team's owner, weekly matchup scores,
# and the champion / runner-up / top seed) are computed automatically by
# scripts/generate.py and must NOT be hand-edited here.
#
# Everything below is OPTIONAL. Leave a field blank ('') or omit it and the
# generator will emit "_TBD_" — never a fabricated value.
#
# How to fill this in:
#   1. owners:        map a team name -> the person who runs it
#   2. champions:     per year, the playoff winner (and runner-up / top seed /
#                     toilet-bowl winner if known). The champion is the ONLY
#                     thing that decides "who won the year" — it is NOT the
#                     regular-season #1.
#   3. aliases:       if a franchise changed its team name across years, list
#                     the historical names under one canonical name so its
#                     history is aggregated correctly.
#   4. player_positions: the position of a player who was drafted and cut before
#                     the first captured roster, so the data has none anywhere.
#   5. franchise_notes: joined year, status, signature moments, etc.
#   6. lore:          curses and infamous incidents (community-sourced).
# =============================================================================

league:
  name: Pine Hills Fantasy League
  established: 2018

# --- Eras --------------------------------------------------------------------
# The league has not always run on the same platform, and which platform a
# season ran on decides whether this wiki has data for it at all. Each era is
# one continuous stretch on one platform, oldest first.
#
# Fields: `name` and `platform` are printed; `first_season` is required;
# `last_season` is omitted while an era is still running; `captured` says
# whether the seasons in it are in raw/ (leave false until a harvest lands, so
# the History page never implies data the wiki does not have); `note` is free
# text for anything worth recording about the move.
eras:
  - name: Pine Hills
    platform: Yahoo Fantasy Football
    first_season: 2018
    last_season: 2025
    captured: true
    note: >-
      Eight seasons on Yahoo. Every season, franchise, record and award on this
      wiki is derived from the Yahoo capture of these years.
  - name: Pine Hills V2
    platform: Sleeper
    first_season: 2026
    captured: true
    note: >-
      The league moved to Sleeper for 2026, as a new ten-team league rather than
      a continuation of the Yahoo one. Sleeper publishes a free read-only API,
      so this era needs no browser capture. The draft is captured; the season
      has not begun, so 2026 carries a roster and a draft board but no record,
      finish or champion.

# --- Owners -----------------------------------------------------------------
# team name (as it appears in a season) -> owner name
owners:
  "Save Me": Naren

# --- Owner aliases (same person, different spelling) -------------------------
# canonical person -> list of spellings the data has reported for them.
# Casing is merged automatically ("lokesh" and "Lokesh" are already one person),
# so this is only needed for genuinely different spellings or nicknames. The
# canonical name here is what the owner page is titled and slugged from.
#
# THIS BLOCK IS WHAT SPANS THE ERAS. Yahoo (2018-2025) reports a manager's first
# name; Sleeper (2026-) reports the account handle instead, and the two never
# match on their own. Every handle listed here folds into the person above it,
# so one manager keeps one owner page across both platforms. A handle left out
# of this block gets its own page, splitting that manager's history in half.
owner_aliases:
# Every 2026 Sleeper manager appears here, so all ten carry their Yahoo history
# forward. Managers who did not move to Sleeper (Aneesh, Aryan, Jayesh, Jeremy,
# Om, sahil) need no entry — their Yahoo name is already canonical.
  # Yahoo reported these two managers under a name that is not their own. The
  # canonical name is the real person, so that is what titles the owner page,
  # and every platform spelling folds into it.
  Abhinav: [Super, silversur4]
  Lokesh: [lokesh, CurryMan123]
  Anish: [anishattarde]
  Kaushal: [kaushpotato]      # team name is "Kaushal's Potatoes"
  Michael: [micjes71]
  Naren: [D4rthSi]            # team name "SlidInTheDMs"
  Pranav: [pranavnar]
  Sharman: [sharwoman]
  Tanmay: [bigbootytan]
  Varun: [vchapa14]           # team name "all hail dallas"

# --- Team images -------------------------------------------------------------
# team name (as it appears in a season) -> image for that franchise.
# Yahoo's capture carries no logo, so these are hand-supplied. Drop the file in
# zensical/docs/assets/teams/ and reference it by file name; a docs-relative
# path or an absolute https:// URL also works. The image heads the team's
# infobox and appears as a thumbnail in the Teams and Owners tables. Teams
# missing from this map simply render without an image.
#   "Roger That": roger-that.png
team_images: {}

# --- Player positions (gap-fill only) ----------------------------------------
# player name (exactly as Yahoo reports it) -> fantasy position.
#
# Rosters carry a position for every player; draft boards do not, and
# backfill_draft_positions() fills the board from the rosters. That leaves the
# handful of players who were drafted and then cut before the first captured
# weekly roster with no position anywhere in the data. They are listed here, one
# per line, with the source that confirms the position.
#
# Use Yahoo's fantasy vocabulary (QB / RB / WR / TE / K / DEF), not the NFL's
# roster designation: the whole site groups and sorts on Yahoo's positions, and
# a one-player "FB" section would be an artifact of this file rather than of the
# league. Where the two differ, the note says so.
player_positions:
  # nfl.com lists Watt at FB; Yahoo files fullbacks as RB.
  "Derek Watt": RB           # https://www.nfl.com/players/derek-watt/
  "Derrius Guice": RB        # https://www.nfl.com/players/derrius-guice/
  "Doug Baldwin": WR         # https://www.pro-football-reference.com/players/B/BaldDo00.htm
  "Elijah Arroyo": TE        # https://www.nfl.com/players/elijah-arroyo/
  "Geronimo Allison": WR     # https://www.nfl.com/players/geronimo-allison/
  # Drafted as a WR in 2015, moved to RB in 2016 and taken as one in this
  # league's 2018 draft. nfl.com still lists him WR.
  "Ty Montgomery II": RB     # https://en.wikipedia.org/wiki/Ty_Montgomery

# --- Player aliases (same player, different spelling) ------------------------
# canonical player name -> list of spellings the platforms have reported.
#
# This is the player-level twin of `owner_aliases`, and it exists for the same
# reason: Yahoo files a player under his full legal name ("Aaron Jones Sr.")
# while Sleeper drops the generational suffix ("Aaron Jones"). Without a fold,
# the platform move in 2026 gives one player two pages and splits his draft and
# roster history down the middle.
#
# The canonical name on the left is what titles the player page, so it should be
# the fuller, correct form. Every entry below was found by matching a 2026
# Sleeper name against a 2018-2025 Yahoo name ignoring suffixes; team defenses
# are handled in the scraper instead, which files them under the nickname the
# Yahoo era used.
player_aliases:
  "Aaron Jones Sr.": ["Aaron Jones"]
  "Brian Thomas Jr.": ["Brian Thomas"]
  "Chris Godwin Jr.": ["Chris Godwin"]
  "Deebo Samuel Sr.": ["Deebo Samuel"]
  "Harold Fannin Jr.": ["Harold Fannin"]
  "James Cook III": ["James Cook"]
  "Kenneth Walker III": ["Kenneth Walker"]
  "Kyle Pitts Sr.": ["Kyle Pitts"]
  "Marvin Harrison Jr.": ["Marvin Harrison"]
  "Michael Pittman Jr.": ["Michael Pittman"]
  "Travis Etienne Jr.": ["Travis Etienne"]

# --- Champions (playoff winners, NOT regular-season #1) ----------------------
# All four fields are now DERIVED from the Yahoo v2 API and written into
# raw/<year>.json by `phf-scraper --from-v2`:
#   champion / runner_up  <- final playoff-adjusted standings rank 1 / 2
#   top_seed              <- the team that entered the playoffs seeded 1
#   toilet_winner         <- whoever finished last in the final standings
# generate.py overlays those values on top of this block, so anything typed here
# is ignored whenever derived data exists. Leave them blank.
champions:
  2025: { champion: "", runner_up: "", top_seed: "", toilet_winner: "" }
  2024: { champion: "", runner_up: "", top_seed: "", toilet_winner: "" }
  2023: { champion: "", runner_up: "", top_seed: "", toilet_winner: "" }
  2022: { champion: "", runner_up: "", top_seed: "", toilet_winner: "" }
  2021: { champion: "", runner_up: "", top_seed: "", toilet_winner: "" }
  2020: { champion: "", runner_up: "", top_seed: "", toilet_winner: "" }
  2019: { champion: "", runner_up: "", top_seed: "", toilet_winner: "" }
  2018: { champion: "", runner_up: "", top_seed: "", toilet_winner: "" }

# --- Hall of Fame ------------------------------------------------------------
# Induction is computed; this is the one human override. A player listed here is
# permanently ineligible by league decision, however his record reads -- the
# same thing MLB's permanently ineligible list does to Pete Rose. The Hall of
# Fame page names everyone on it, so the exclusion is visible rather than a
# silent hole in a page that claims to compute its own members.
# name -> reason (a blank reason prints the name with no explanation)
hall_of_fame:
  ineligible:
    "Deshaun Watson": ""

# --- Franchise aliases (name changes across years) ---------------------------
# canonical name -> list of names that belong to the same franchise
aliases: {}

# --- Per-franchise notes -----------------------------------------------------
# canonical name -> free-form facts
franchise_notes: {}

# --- Lore --------------------------------------------------------------------
# Community-sourced league history: the vetoed trades, bad beats, curses and
# arguments no scoreboard records. This block is the ONLY source for the Lore
# page - an empty list prints an invitation to fill it in, never an invention.
#
# Each entry: `title` and `story` are printed; `year` and `involved` (team or
# manager names, which become links) are optional. `story` takes a YAML block
# scalar, so it can run to as many paragraphs as the story needs.
#
#   incidents:
#     - year: 2022
#       title: The Vetoed Trade
#       involved: ["Roger That", "Save Me"]
#       story: |
#         What happened, and why it is still brought up.
#   curses:
#     - title: The Kicker Curse
#       involved: ["Stroud Boys"]
#       story: Every kicker they start goes cold the same week.
lore:
  incidents:
    - year: 2018
      title: The Reynolds Reversal
      involved: ["D4rthSi Dragons", "Curry's legit team"]
      story: |
        D4rthSi Dragons lost the [[2018 Season#Playoff Bracket|2018 semifinal]]
        to Curry's legit team, 129.76 to 127.56. Jared Goff, started at quarterback, threw what was ruled a
        34-yard touchdown to Josh Reynolds against the Eagles that week; replay
        reversed the broke-the-plane call, marked Reynolds down at the one, and
        Todd Gurley ran it in on the next play. Goff finished with 11.66.

        D4rthSi Dragons missed the final, and Curry's legit team went on to win
        the 2018 championship.

    - year: 2018
      title: The Tie
      involved: ["Roger That", "Anish's Awesome Team"]
      story: |
        In week 8 of 2018, Roger That and Anish's Awesome Team both scored
        143.20. It is the only tie in the captured seasons, across 615
        matchups.

        Neither was credited with a win, and neither carried a tie column, so
        both finished an eleven-week regular season with ten decisions: Roger
        That 4-6 and Anish's Awesome Team 3-7. Every other 2018 team finished
        with eleven.

        Both made the six-team playoffs, seeded third and sixth, and met again
        in the [[2018 Season#Playoff Bracket|quarterfinal]]. Anish's Awesome
        Team won that one 142.10 to 100.70 and reached the final.

    - year: 2019
      title: Watt Was He Cooking
      involved:
        [
          "Super Squirrels",
          "Ju Let The Dogs Out",
          "Curry's legit team",
          "Roger That",
          "Sharman's Scorpions",
        ]
      story: |
        With the 35th pick of the 2019 draft, third in the fifth round, Super
        Squirrels selected fullback Derek Watt. The next four picks were
        Todd Gurley to Ju Let The Dogs Out, Julian Edelman to Curry's legit
        team, Stefon Diggs to Roger That and Adam Thielen to Sharman's
        Scorpions. Edelman scored 210.00 in started lineups that season, Diggs
        181.60, Thielen 108.20.

        Watt never appeared on a Super Squirrels weekly roster. Super
        Squirrels lost the [[2019 Season#Playoff Bracket|2019 semifinal]] to
        Ju Let The Dogs Out, 169.10 to 130.40.

    - year: 2020
      title: Chopped
      involved: ["CHOPSTIX", "My team is Koo(l)", "Imagine Losing"]
      story: |
        CHOPSTIX finished the 2020 regular season 2-11, the worst record in the
        league, and entered the [[2020 Season#Playoff Bracket|playoffs]] as the
        eighth seed. It had spent the second pick of the 2020 draft on Saquon
        Barkley, who was started twice and scored 15.4. In the quarterfinal it beat the top seed, My team is
        Koo(l), which had finished 9-4, by 118.52 to 117.52. It lost the
        semifinal to Imagine Losing, 111.42 to 130.72.

        No other playoff game in the captured seasons was decided by exactly one
        point.

    - year: 2022
      title: Michael's Marvelous Run
      involved:
        [
          "Michael's Marvelous Team",
          "Sharman's Scorpions",
          "L takes only",
          "Jeremy's Neat Team",
        ]
      story: |
        Michael's Marvelous Team finished the 2022 regular season 5-9 and
        entered the [[2022 Season#Playoff Bracket|playoffs]] as the eighth
        seed. It beat the 11-3 top seed, Sharman's Scorpions, 152.22 to 131.46
        in the quarterfinal, then L takes only 129.76 to 128.90 in the
        semifinal, a margin of 0.86.

        It lost the final to Jeremy's Neat Team, 85.38 to 133.02. Both finalists
        had losing or .500 regular seasons; Jeremy's Neat Team was the sixth
        seed at 7-7.

    - year: 2024
      title: The Nut Famine
      involved: ["Super Squirrels", "Kaushal's Potatoes"]
      story: |
        Super Squirrels finished the 2024 regular season 11-3 and entered the
        [[2024 Season#Playoff Bracket|playoffs]] as the second seed. In the
        quarterfinal it scored 61.88 and lost to the seventh seed, Kaushal's
        Potatoes, 116.74.

        61.88 is the lowest score in any playoff game of the captured seasons.

    - year: 2025
      title: Razor Thin
      involved: ["Save Me", "Sharman's Scorpions", "Big black big back"]
      story: |
        Save Me won its [[2025 Season#Playoff Bracket|2025 quarterfinal]] over
        Sharman's Scorpions 106.50 to 105.16, then lost the semifinal to Big
        black big back 123.70 to 124.18.

        The semifinal margin, 0.48, is the smallest in a playoff game of the
        captured seasons. The two games were decided by 1.82 points combined.
  curses:
    - title: The Bridesmaid Curse
      # Every team Naren has run, oldest first.
      involved:
        [
          "D4rthSi Dragons",
          "Ju Let The Dogs Out",
          "I have Hop(e)",
          "The Herbs",
          "Hill We Go… Again (feat Kyler)",
          "BBigg MACKS",
          "Kamara's a b*tch",
          "Save Me",
        ]
      story: |
        Naren holds the best regular-season record in the league, 64-43 over
        eight seasons, has made the playoffs in seven of them, and has not won
        a title.

        Two reached the final: Ju Let The Dogs Out lost the 2019
        final to Curry's legit team, 123.44 to 156.92, and BBigg MACKS lost the
        2023 final to Super Squirrels, 119.40 to 136.48. D4rthSi Dragons lost
        the 2018 semifinal and Save Me the 2025 semifinal, the latter by 0.48.
        Kamara's a b*tch was the 2024 top seed at 11-3 and lost its quarterfinal
        to the eighth seed.

    - title: The Sharman Playoff Curse
      involved: ["Sharman's Scorpions"]
      story: |
        Sharman's Scorpions have reached the playoffs in six of eight seasons
        and lost every game they played there, 0-6. Each loss was the
        franchise's first game of that postseason.

        Two of the six came as the top seed. The 2018 Scorpions went 9-2, took
        a first-round bye and lost the [[2018 Season#Playoff Bracket|semifinal]]
        98.12 to 148.86 to the sixth seed, which had finished 3-7. The 2022
        Scorpions went 11-3 and lost the
        [[2022 Season#Playoff Bracket|quarterfinal]] 131.46 to 152.22 to the
        eighth seed, which had finished 5-9 and went on to the final.

        Two others were decided by under five points: 123.16 to 127.54 in 2021,
        and 105.16 to 106.50 in 2025. The franchise's regular-season record over
        the eight seasons is 59-48.

    - title: The One Seed Curse
      # Every team that has entered the playoffs seeded first, oldest first.
      # Sharman's Scorpions did it twice (2018, 2022) and is listed once.
      involved:
        [
          "Sharman's Scorpions",
          "Ju Let The Dogs Out",
          "My team is Koo(l)",
          "Super Squirrels",
          "Stroud Boys",
          "Kamara's a b*tch",
          "Roger That",
        ]
      story: |
        In eight captured seasons the team seeded first for the playoffs has
        never won the title. Six were eliminated before the final — 2018, 2020,
        2022, 2023, 2024 and 2025 — and the two that reached it, Ju Let The Dogs
        Out in 2019 and Super Squirrels in 2021, lost.

        No champion has been seeded better than second. Curry's legit team was
        the second seed in 2019; the other seven champions were seeded fifth,
        sixth or seventh. Five of the eight finished the regular season at .500
        or worse, the lowest being Curry's legit team at 4-7 in 2018 and varun's
        victorious team at 6-8 in 2021.

    - title: The MVP Curse
      # Every team that has rostered a season MVP, oldest first; naming only the
      # teams in the story would be arbitrary. 2019 is two: Dalvin Cook swung
      # five wins for CHOPSTIX and one for Super Squirrels.
      involved:
        [
          "Sharman's Scorpions",
          "CHOPSTIX",
          "Super Squirrels",
          "Anish's Awesome Team",
          "L takes only",
          "Pukakke NaKupp",
          "Kamara's a b*tch",
          "Roger That",
        ]
      story: |
        In eight captured seasons the Most Valuable Player has never been on
        the roster that won the title.

        Anish has rostered the MVP twice, under two team names, and won
        neither: Kyler Murray's nine swung wins for Anish's Awesome Team in
        2020, the largest haul on record, and Josh Allen for Pukakke NaKupp in
        2023. Super Squirrels held Cooper Kupp for all six of his swung wins in
        2021 and lost to varun's victorious team, then took the 2023 title
        without the MVP.
