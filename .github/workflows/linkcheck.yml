name: Wikilink link-check

on:
  push:
    branches: [feat/astro-wiki, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Build permalink map
        run: node scripts/wikilink-map.mjs
      - name: Regenerate content (repointed generator)
        run: python3 scripts/generate.py
      - name: Wikilink link-check (fails only on malformed links)
        run: node scripts/migrate-wikilinks.mjs --check --report
