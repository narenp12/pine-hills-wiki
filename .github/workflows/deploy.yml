name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Installs the locked environment from uv.lock, including the dev group
      # that provides the `zensical` binary build.mjs shells out to.
      - name: Install build environment
        run: uv sync --locked --group dev

      # Before the build, not after: the suite asserts the row counts, the owner
      # join and the champion flags the build then renders, so a capture that
      # broke one of them should fail here rather than deploy a wrong page.
      - name: Run tests
        run: |
          uv run pytest -q
          # Node 22's runner treats a positional arg as a test file, not a
          # directory to walk, so let the shell expand the files instead.
          node --test tests/js/*.test.mjs

      - name: Build Zensical site
        run: node zensical/build.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: zensical/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
