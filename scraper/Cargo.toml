[package]
name = "phf-scraper"
version = "0.1.0"
edition = "2024"
description = "Free, no-key scraper for Pine Hills Yahoo Fantasy Football history. Reuses your logged-in Chrome session via CDP, parses rendered HTML, and emits raw/<year>.json for the wiki."

[dependencies]
# Browser automation over the Chrome DevTools Protocol. Best-maintained Rust
# option (async, direct CDP; no separate WebDriver/driver binary needed).
# We point it at the Chromium already in ~/.cache/ms-playwright.
chromiumoxide = "0.9"
# Browser-grade HTML parsing/querying.
scraper = "0.27"
# Async runtime.
tokio = { version = "1", features = ["full"] }
# Stream utilities (handler polling).
futures = "0.3"
# Serialization for the canonical model + emit.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structured logging (replaces ad-hoc eprintln! warnings). `-v`/RUST_LOG gives
# verbosity control; warnings stay distinct from stdout progress output.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Ergonomic errors + CLI parsing.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# TOML for the externalized selector config.
toml = "0.8"
# Resolving the CDP WebSocket endpoint from Chrome's HTTP /json/version when
# the user passes the http(s) debugger URL to --connect.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
serde_json = "1"
